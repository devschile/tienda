[build]
  publish = "dist"
  # Instala deps de la raíz Y de las Netlify Functions antes del build
  command = "npm install && npm install --prefix netlify/functions && npx vite build"

[build.environment]
  # PostHog Analytics (browser) - VITE_ vars are inlined at build time
  VITE_POSTHOG_KEY = "phc_pMbrDFcoVoYS9kqBRmgLEzdTjuNXYqV4sypn7YsnFuY4"
  VITE_POSTHOG_HOST = "https://us.i.posthog.com"

[functions]
  directory = "netlify/functions"

# Reconciliación de pagos: cada 5 min revisa órdenes pending/pending_transfer
# contra la API de MP y auto-aprueba + descuenta stock si el pago fue aprobado.
# Es el respaldo del webhook en tiempo real (si se pierde/rechaza una
# notificación, la orden igual pasa a approved sola).
[[scheduled.functions]]
  functions = ["reconcile-payments"]
  schedule = "*/5 * * * *"

# og-image usa @napi-rs/canvas (binario nativo .node) que el bundler no puede
# inline. Se excluye externo solo para esta función: se copia tal cual, junto
# con las fuentes de la tarjeta OG. El resto de funciones usan el bundler
# normal (resuelve require() relativos y dependencias).
[functions.og-image]
  node_bundler = "esbuild"
  external_node_modules = ["@napi-rs/canvas"]
  included_files = ["netlify/functions/fonts/**"]

# Headers para todos los recursos
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Admin — no indexar por buscadores
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Caché larga para assets con hash (JS/CSS/imágenes del bundle de Vite)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Caché corta para HTML (siempre fresco)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Sin caché para favicons y manifest (pueden cambiar con nuevas versiones)
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Admin API — enruta /admin-api/* a la función router CRUD
# DEBE ir antes del catch-all /* para que Netlify no sirva index.html
[[redirects]]
  from = "/admin-api/*"
  to   = "/.netlify/functions/admin-api/:splat"
  status = 200

# Imagen OG de producto — enruta /og-image/<id>.png a la función generadora
# DEBE ir antes del catch-all /* (la URL es determinística y se cachea en el CDN)
[[redirects]]
  from = "/og-image/*"
  to   = "/.netlify/functions/og-image/:splat"
  status = 200

# Meta OG por producto — inyecta tags en el HTML de la SPA para /p/<id>
# (se ejecuta antes del redirect catch-all, así se sirve index.html + meta)
[[edge_functions]]
  path = "/p/*"
  function = "product-og"

# SPA catch-all — siempre al final
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
